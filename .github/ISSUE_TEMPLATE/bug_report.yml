name: Bug report
description: Report reproducible behavior on a supported device
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I own or am authorized to administer this television.
          required: true
        - label: I removed IP/MAC addresses, serials, account data and credentials from logs.
          required: true
  - type: input
    attributes:
      label: Model and device/board
      placeholder: MiTV-ASTR0 / blueplanet
    validations:
      required: true
  - type: input
    attributes:
      label: Firmware and Android version
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior and reproduction
    validations:
      required: true
  - type: textarea
    attributes:
      label: Redacted verification/diagnosis output

