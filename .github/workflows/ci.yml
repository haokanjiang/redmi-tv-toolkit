name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run repository self-test
        shell: pwsh
        run: |
          ./scripts/self-test.ps1
          ./tests/smoke.ps1

  build-apk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: pwsh
        run: sdkmanager "platforms;android-30" "build-tools;35.0.0"
      - name: Build APK
        shell: pwsh
        run: ./app/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: community-test-apk
          path: |
            app/dist/redmi-tv-toolkit.apk
            app/dist/redmi-tv-toolkit.apk.sha256
          if-no-files-found: error
